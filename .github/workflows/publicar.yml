name: Validar PCMasterUtility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/ModuleTests.csproj -c Release
      - run: dotnet publish PcismoMaster.csproj -c Release -r win-x64 --self-contained true -o dist --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: PCMasterUtility-win-x64
          path: dist/
